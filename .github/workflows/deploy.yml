# Envoie le site sur l'hébergement OVH à chaque push sur main.
# Le mot de passe FTP est rangé dans les secrets du dépôt (FTP_PASSWORD), jamais dans le code.
name: Mise en ligne OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.cluster121.hosting.ovh.net
          username: pirasto
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /www/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            .impeccable/**
